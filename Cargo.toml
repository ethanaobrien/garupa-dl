[package]
name = "bandori"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = "0.13.4"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
http = "1.5.0"
prost = "0.14.4"
clap = { version = "4.6.6", features = ["derive"] }
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }

[build-dependencies]
prost-build = "0.14.4"
